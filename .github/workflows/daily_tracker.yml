name: Daily Melbourne Property Tracker & GitHub Pages Deploy

on:
  schedule:
    # 21:00 UTC = 8:00 AM Melbourne Time (AEDT / UTC+11)
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily_tracker.yml'
      - 'src/**'
      - 'docs/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  track-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion & Machine Learning Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests python-dotenv beautifulsoup4 sqlalchemy geoalchemy2

      - name: Run Daily Ingestion & Valuation Pipeline
        run: |
          python -m src.run_daily_tracker

      - name: Commit & Push Updated Market Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "chore(data): auto-update daily Melbourne property tracker [skip ci]"
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './docs'

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: track-and-build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
